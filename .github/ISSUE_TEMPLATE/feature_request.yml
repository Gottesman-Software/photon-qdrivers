name: Feature request
description: Propose a new capability or integration.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the API, backend, runtime, FPGA, or documentation change.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Python API
        - Emulator adapter
        - Hardware adapter
        - C++ runtime / HAL
        - FPGA RTL / HLS
        - Documentation
        - Benchmarking
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Link papers, vendor docs, SDK docs, or related implementations.
    validations:
      required: false
